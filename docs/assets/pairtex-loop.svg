<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 1300 900" role="img" aria-labelledby="title desc">
  <title id="title">PairTeX human-agent writing loop</title>
  <desc id="desc">Humans can edit the canonical TeX directly or leave feedback in a disposable HTML artifact. Coding agents can consume the structured feedback and modify TeX. PairTeX owns the TeX to HTML adapter and the feedback artifact contract, but never modifies the source repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101d2b"/><stop offset="1" stop-color="#1d3342"/></linearGradient>
    <linearGradient id="html" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf8ff"/><stop offset="1" stop-color="#d8ebf6"/></linearGradient>
    <linearGradient id="tex" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff9ec"/><stop offset="1" stop-color="#f4e8cf"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#07111b" flood-opacity=".28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9ac9c4"/></marker>
    <marker id="source-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d8b56a"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 35px; font-weight: 750; fill: #f5f9fc; }
      .subtitle { font-size: 18px; fill: #c0d0da; }
      .role { font-size: 16px; font-weight: 750; letter-spacing: 1.4px; }
      .card-title { font-size: 26px; font-weight: 750; }
      .body { font-size: 18px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; }
      .label { font-size: 16px; font-weight: 700; fill: #d9eeee; }
      .projection-label { fill: #c8ece8; }
      .source-label { fill: #f1d28d; }
      .scope-label { font-size: 15px; font-weight: 750; letter-spacing: 1.2px; fill: #a9d8d1; }
      .small { font-size: 16px; fill: #c0d0da; }
      .label-box { fill: #203d4a; stroke: #487078; stroke-width: 1.5; }
      .projection-box { fill: #203d4a; stroke: #5c9f99; stroke-width: 1.5; }
      .source-box { fill: #493b25; stroke: #b8893b; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="-30" width="1300" height="900" rx="30" fill="url(#bg)"/>
  <text x="70" y="62" class="title">PairTeX</text>
  <text x="70" y="96" class="subtitle">A tiny, hot-pluggable TeX → HTML layer for human–agent pair writing</text>
  <rect x="934" y="45" width="196" height="38" rx="19" fill="#8ec8f0" opacity=".16" stroke="#8ec8f0" stroke-opacity=".5"/>
  <text x="1032" y="70" text-anchor="middle" font-size="16" font-weight="650" fill="#d0ecfa">source stays untouched</text>

  <!-- PairTeX owns the projection and the artifact contract. -->
  <rect x="350" y="130" width="550" height="520" rx="28" fill="#17313d" fill-opacity=".52" stroke="#6da9a5" stroke-width="2" stroke-dasharray="9 8"/>
  <text x="625" y="164" text-anchor="middle" class="scope-label">PairTeX SCOPE</text>
  <text x="625" y="188" text-anchor="middle" class="small">drop in · use locally · unplug cleanly · no project rewrite</text>

  <!-- Human -->
  <g filter="url(#shadow)">
    <rect x="-20" y="205" width="300" height="335" rx="24" fill="#dceef7"/>
    <text x="130" y="325" text-anchor="middle" font-size="92">🧑</text>
    <text x="130" y="374" text-anchor="middle" class="role" fill="#416b82">HUMAN</text>
    <text x="130" y="416" text-anchor="middle" class="card-title" fill="#142d3d">Read and decide</text>
    <text x="130" y="450" text-anchor="middle" font-size="17" fill="#34576b">Edit HTML · review · comment</text>
    <text x="130" y="480" text-anchor="middle" font-size="17" fill="#416b82">or edit TeX directly</text>
  </g>

  <!-- HTML artifact -->
  <g filter="url(#shadow)">
    <rect x="450" y="205" width="350" height="155" rx="20" fill="url(#html)"/>
    <rect x="450" y="205" width="350" height="12" rx="6" fill="#9ec6df"/>
    <text x="484" y="252" class="role" fill="#416b82">HTML ARTIFACT</text>
    <text x="484" y="290" class="card-title" fill="#142d3d">Interactive paper view</text>
    <text x="484" y="316" font-size="17" fill="#34576b">Rendered prose + math</text>
    <text x="484" y="341" font-size="17" fill="#34576b">for human feedback</text>
  </g>

  <!-- Feedback contract -->
  <g filter="url(#shadow)">
    <rect x="450" y="445" width="350" height="180" rx="20" fill="#e1f1e7"/>
    <text x="484" y="497" class="role" fill="#467762">FEEDBACK ARTIFACT</text>
    <text x="484" y="533" font-size="22" font-weight="750" fill="#18352b">Structured, source-anchored</text>
    <text x="484" y="564" font-size="22" font-weight="750" fill="#18352b">feedback input</text>
    <text x="484" y="594" class="mono" fill="#315d49">.pairtex/feedback/*.json</text>
    <text x="484" y="610" class="mono" fill="#315d49">+ agent skill</text>
  </g>

  <!-- Coding agent -->
  <g filter="url(#shadow)">
    <rect x="970" y="205" width="290" height="335" rx="24" fill="#e6e1f7"/>
    <text x="1115" y="325" text-anchor="middle" font-size="92">🤖</text>
    <text x="1115" y="374" text-anchor="middle" class="role" fill="#635d91">CODING AGENT</text>
    <text x="1115" y="416" text-anchor="middle" class="card-title" fill="#292442">Consume and change</text>
    <text x="1115" y="450" text-anchor="middle" font-size="17" fill="#504b70">Read artifacts · edit TeX</text>
    <text x="1115" y="480" text-anchor="middle" font-size="17" fill="#504b70">build · resolve · reply</text>
  </g>

  <!-- Canonical TeX stays outside PairTeX. -->
  <g filter="url(#shadow)">
    <rect x="450" y="680" width="350" height="140" rx="20" fill="url(#tex)"/>
    <text x="484" y="717" class="role" fill="#876d3d">CANONICAL TEX REPOSITORY</text>
    <text x="484" y="746" class="mono" fill="#806c4a">main.tex · sections/ · .bib</text>
    <text x="484" y="770" class="mono" fill="#806c4a">figures/ · Git</text>
    <text x="484" y="790" font-size="15" font-weight="650" fill="#725d34">PairTeX reads; user/agent owns changes</text>
  </g>

  <!-- All connectors are orthogonal and all labels sit in separate boxes. -->
  <path d="M280 285 H450" fill="none" stroke="#9ac9c4" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="321" y="238" width="68" height="30" rx="10" class="label-box"/>
  <text x="355" y="259" text-anchor="middle" class="label">read</text>

  <path d="M800 285 H970" fill="none" stroke="#9ac9c4" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="815" y="238" width="80" height="30" rx="10" class="label-box"/>
  <text x="855" y="259" text-anchor="middle" class="label">consume</text>

  <path d="M800 535 H850 V285" fill="none" stroke="#9ac9c4" stroke-width="4"/>

  <path d="M625 360 V445" fill="none" stroke="#9ac9c4" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="650" y="395" width="155" height="30" rx="10" class="label-box"/>
  <text x="727" y="416" text-anchor="middle" class="label">comment / review</text>

  <path d="M970 470 H915 V752 H800" fill="none" stroke="#9ac9c4" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="866" y="572" width="132" height="30" rx="10" class="label-box"/>
  <text x="932" y="593" text-anchor="middle" class="label">change TeX</text>

  <path d="M450 752 H380 V330 H450" fill="none" stroke="#9ac9c4" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="390" y="375" width="136" height="30" rx="10" class="projection-box"/>
  <text x="458" y="396" text-anchor="middle" class="label projection-label">render + refresh</text>

  <path d="M280 495 H335 V752 H450" fill="none" stroke="#d8b56a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#source-arrow)"/>
  <rect x="165" y="665" width="136" height="30" rx="10" class="source-box"/>
  <text x="233" y="686" text-anchor="middle" class="label source-label">direct TeX edit</text>

  <text x="600" y="875" text-anchor="middle" class="small">PairTeX does not rewrite TeX. It adapts the projection and defines the feedback contract agents can consume.</text>
</svg>
