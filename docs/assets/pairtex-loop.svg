<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PairTeX human-agent writing loop</title>
  <desc id="desc">A human interacts with a disposable HTML artifact on the left side of the workflow, while a coding agent works with the canonical TeX repository on the right. PairTeX connects their feedback without modifying the original source.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d2b"/><stop offset="1" stop-color="#1d3342"/>
    </linearGradient>
    <linearGradient id="html" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf8ff"/><stop offset="1" stop-color="#d8ebf6"/>
    </linearGradient>
    <linearGradient id="tex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9ec"/><stop offset="1" stop-color="#f4e8cf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#07111b" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9ac9c4"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 34px; font-weight: 750; fill: #f5f9fc; }
      .subtitle { font-size: 18px; fill: #c0d0da; }
      .role { font-size: 17px; font-weight: 750; letter-spacing: 1.4px; }
      .card-title { font-size: 27px; font-weight: 750; }
      .body { font-size: 18px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; }
      .label { font-size: 16px; font-weight: 650; fill: #a9c6cc; }
      .small { font-size: 15px; fill: #c0d0da; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <text x="70" y="64" class="title">PairTeX</text>
  <text x="70" y="98" class="subtitle">Human–agent pair writing for existing LaTeX papers</text>
  <rect x="914" y="48" width="216" height="38" rx="19" fill="#8ec8f0" opacity=".16" stroke="#8ec8f0" stroke-opacity=".5"/>
  <text x="1022" y="73" text-anchor="middle" font-size="16" font-weight="650" fill="#d0ecfa">LaTeX stays canonical</text>

  <!-- Human -->
  <g filter="url(#shadow)">
    <rect x="70" y="190" width="250" height="350" rx="24" fill="#dceef7"/>
    <text x="195" y="318" text-anchor="middle" font-size="92">🧑</text>
    <text x="195" y="370" text-anchor="middle" class="role" fill="#416b82">HUMAN</text>
    <text x="195" y="412" text-anchor="middle" class="card-title" fill="#142d3d">Read and review</text>
    <text x="195" y="451" text-anchor="middle" class="body" fill="#34576b">Edit · suggest · comment</text>
    <text x="195" y="493" text-anchor="middle" class="small" fill="#416b82">No source files changed</text>
  </g>

  <!-- HTML artifact -->
  <g filter="url(#shadow)">
    <rect x="410" y="145" width="380" height="220" rx="22" fill="url(#html)"/>
    <rect x="410" y="145" width="380" height="13" rx="6" fill="#9ec6df"/>
    <text x="444" y="198" class="role" fill="#416b82">HTML ARTIFACT</text>
    <text x="444" y="242" class="card-title" fill="#142d3d">Interactive paper view</text>
    <text x="444" y="278" class="body" fill="#34576b">Readable layout for human feedback</text>
    <rect x="444" y="304" width="286" height="31" rx="8" fill="#fff" stroke="#a4c9dc"/>
    <text x="460" y="326" font-size="16" fill="#416b82">“Please clarify this claim.”</text>
  </g>

  <!-- TeX artifact -->
  <g filter="url(#shadow)">
    <rect x="410" y="420" width="380" height="220" rx="22" fill="url(#tex)"/>
    <text x="444" y="473" class="role" fill="#876d3d">TEX REPOSITORY</text>
    <text x="444" y="517" class="card-title" fill="#3b3020">Canonical source</text>
    <text x="444" y="553" class="mono" fill="#806c4a">main.tex · sections/ · .bib</text>
    <text x="444" y="581" class="mono" fill="#806c4a">figures/ · styles/ · Git</text>
    <rect x="444" y="600" width="194" height="26" rx="13" fill="#ead9b3"/>
    <text x="541" y="619" text-anchor="middle" font-size="15" font-weight="650" fill="#725d34">PairTeX: read only</text>
  </g>

  <!-- Coding agent -->
  <g filter="url(#shadow)">
    <rect x="880" y="190" width="250" height="350" rx="24" fill="#e6e1f7"/>
    <text x="1005" y="318" text-anchor="middle" font-size="92">🤖</text>
    <text x="1005" y="370" text-anchor="middle" class="role" fill="#635d91">CODING AGENT</text>
    <text x="1005" y="412" text-anchor="middle" class="card-title" fill="#292442">Work in the repo</text>
    <text x="1005" y="451" text-anchor="middle" class="body" fill="#504b70">Inspect · edit TeX · build</text>
    <text x="1005" y="493" text-anchor="middle" class="small" fill="#514b7e">Commit, then refresh HTML</text>
  </g>

  <!-- Orthogonal, edge-to-edge connections. -->
  <path d="M320 275 H410" fill="none" stroke="#9ac9c4" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="365" y="258" text-anchor="middle" class="label">read / feedback</text>

  <path d="M790 275 H880" fill="none" stroke="#9ac9c4" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="835" y="258" text-anchor="middle" class="label">structured input</text>

  <path d="M880 455 H835 V530 H790" fill="none" stroke="#9ac9c4" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="835" y="565" text-anchor="middle" class="label">change source</text>

  <path d="M410 530 H365 V455 H320" fill="none" stroke="#9ac9c4" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="365" y="565" text-anchor="middle" class="label">new projection</text>

  <text x="600" y="684" text-anchor="middle" class="small">Human interacts through HTML. The agent works through TeX. PairTeX keeps the boundary clean.</text>
</svg>
