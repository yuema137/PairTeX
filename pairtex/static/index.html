<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PairTeX</title>
    <link rel="stylesheet" href="/style.css">
    <script>
      window.MathJax = { tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]] }, startup: { typeset: false } };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="/">PairTeX</a>
        <div class="modes" role="group" aria-label="Interaction mode">
          <button class="mode is-active" data-mode="edit">Edit</button>
          <button class="mode" data-mode="review">Review</button>
        </div>
        <button class="save-edits" id="save-edits">Save edits</button>
        <button class="discard-edits" id="discard-edits">Discard edits</button>
        <div class="mode-hint" id="mode-hint">Direct edits are recorded as accepted intents.</div>
        <div class="theme-controls" aria-label="Appearance">
          <label class="theme-control">
            <span class="sr-only">Color mode</span>
            <select id="theme-mode">
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
          <label class="theme-control">
            <span class="sr-only">Color palette</span>
            <select id="theme-palette">
              <option value="ocean">Ocean</option>
              <option value="sage">Sage</option>
              <option value="plum">Plum</option>
            </select>
          </label>
        </div>
        <div class="status" id="version-status">Loading version…</div>
      </div>
    </header>

    <main class="layout">
      <article class="paper-shell">
        <nav class="paper-tabs" id="paper-tabs" aria-label="Manuscript sections"></nav>
        <article class="paper" id="paper" aria-label="Rendered manuscript"></article>
      </article>
      <aside class="sidebar">
        <div class="sidebar__head">
          <div>
            <p class="eyebrow">Feedback</p>
            <h1>Entries</h1>
          </div>
          <span class="count" id="entry-count">0</span>
        </div>
        <p class="help">Select manuscript text to leave a comment or record a change intent.</p>
        <div id="entries" class="entries"></div>
      </aside>
    </main>

    <div class="selection-tools" id="selection-tools" hidden>
      <button data-action="comment">Comment</button>
      <button data-action="change" id="change-action">Edit text</button>
    </div>

    <dialog id="entry-dialog">
      <form method="dialog" id="entry-form">
        <p class="eyebrow" id="dialog-kind">Comment</p>
        <h2 id="dialog-title">Add feedback</h2>
        <p class="quoted" id="dialog-quote"></p>
        <label id="change-label" hidden>
          Proposed text
          <textarea id="proposed-text" rows="4"></textarea>
        </label>
        <label>
          <span id="message-label">Comment</span>
          <textarea id="message" rows="5"></textarea>
        </label>
        <div class="dialog-actions">
          <button type="button" id="cancel-entry" class="button secondary">Cancel</button>
          <button value="save" class="button primary" id="save-entry">Save edit</button>
        </div>
      </form>
    </dialog>

    <dialog id="math-dialog">
      <form method="dialog" id="math-form">
        <p class="eyebrow">Math editor</p>
        <h2>Edit formula</h2>
        <label>
          LaTeX source
          <textarea id="math-source" rows="4" spellcheck="false"></textarea>
        </label>
        <div class="math-preview-label">Live preview</div>
        <div id="math-preview" class="math-preview"></div>
        <div class="dialog-actions">
          <button type="button" id="cancel-math" class="button secondary">Cancel</button>
          <button value="save" class="button primary">Save formula</button>
        </div>
      </form>
    </dialog>

    <script src="/themes.js"></script>
    <script src="/theme.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
